<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset=".55" stop-color="#0D1117" stop-opacity=".85"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="340" rx="18" fill="#0D1117"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)"/>
  <rect width="760" height="340" rx="18" fill="url(#fade)"/>
  <rect x="0" y="0" width="6" height="340" fill="#E8A33D" clip-path="url(#card)"/>

  <!-- left: identity -->
  <text x="64" y="86" class="mono" font-size="16" fill="#E8A33D">~/andrewtanui</text>
  <text x="64" y="156" class="sans" font-size="64" font-weight="700" fill="#F0F6FC" letter-spacing="-1">Andrew Tanui</text>
  <text x="64" y="198" class="sans" font-size="24" fill="#8B949E">Full-Stack &amp; Power Platform Developer</text>
  <text x="64" y="262" class="mono" font-size="16" fill="#C9D1D9">
    <tspan fill="#E8A33D">$</tspan> replace --spreadsheets --paper --email-chains
  </text>
  <rect x="556" y="248" width="9" height="18" fill="#E8A33D" class="cursor"/>
  <text x="64" y="296" class="sans" font-size="15" fill="#6E7681">Next.js · TypeScript · Postgres · Power Apps · Dataverse · grounded AI</text>

  <!-- right: many sources, one source of truth -->
  <g class="sans" font-size="14">
    <g fill="#161B22" stroke="#30363D">
      <rect x="800" y="70" width="140" height="44" rx="8"/>
      <rect x="800" y="148" width="140" height="44" rx="8"/>
      <rect x="800" y="226" width="140" height="44" rx="8"/>
    </g>
    <g fill="#8B949E" text-anchor="middle">
      <text x="870" y="97">spreadsheets</text>
      <text x="870" y="175">paper sheets</text>
      <text x="870" y="253">email chains</text>
    </g>
    <g fill="none" stroke="#E8A33D" stroke-width="2" class="flow">
      <path d="M940 92 C 990 92, 990 170, 1030 170"/>
      <path d="M940 170 L 1030 170"/>
      <path d="M940 248 C 990 248, 990 170, 1030 170"/>
    </g>
    <rect x="1022" y="128" width="136" height="84" rx="10" fill="#E8A33D" class="pulse"/>
    <rect x="1030" y="136" width="120" height="68" rx="8" fill="#E8A33D"/>
    <g fill="#0D1117" text-anchor="middle" font-weight="700">
      <text x="1090" y="166">one source</text>
      <text x="1090" y="186">of truth</text>
    </g>
  </g>
</svg>
